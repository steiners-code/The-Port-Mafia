services:
  api-gateway:
    build: ./backend/api-gateway
    container_name: mafia-api-gateway
    restart: always
    ports:
      - "3810:3000"
    env_file:
      - ./backend/api-gateway/.env
    networks:
      - mafia-network
      - global-database-network
    depends_on:
      - main-service
      - linkedin-service

  main-service:
    build: ./backend/main
    container_name: mafia-main
    restart: always
    env_file:
      - ./backend/main/.env
    networks:
      - mafia-network
      - global-database-network
    depends_on:
      - frontend

  main-worker:
    build: ./backend/main
    container_name: mafia-main-worker
    restart: always
    command: bun run worker
    env_file:
      - ./backend/main/.env
    volumes:
      - ./backend/main:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - mafia-network
      - global-database-network
    depends_on:
      - redis

  linkedin-service:
    build: ./backend/linkedin
    container_name: mafia-linkedin
    restart: always
    env_file:
      - ./backend/linkedin/.env
    networks:
      - mafia-network
      - global-database-network

  linkedin-worker:
    build: ./backend/linkedin
    container_name: mafia-linkedin-worker
    restart: always
    command: bun run worker
    env_file:
      - ./backend/linkedin/.env
    volumes:
      - ./backend/linkedin:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - mafia-network
      - global-database-network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: mafia-redis
    restart: always
    volumes:
      - mafia-redis-data:/data
    networks:
      - mafia-network

  frontend:
    build: ./frontend
    container_name: mafia-frontend
    restart: always
    ports:
      - "81:3000"
    networks:
      - mafia-network
    env_file:
      - ./frontend/.env

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: cron-ofelia
    restart: always
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mafia-network
    depends_on:
      - main-service
      - linkedin-service
    labels:
      ofelia.enabled: "true"

      # Job 1: LinkedIn Trigger
      # ofelia.job-run.linkedin-trigger.schedule: "0 0 * * * *"
      # ofelia.job-run.linkedin-trigger.image: "curlimages/curl:latest"
      # ofelia.job-run.linkedin-trigger.network: "mafia-network"
      # ofelia.job-run.linkedin-trigger.command: >-
      #   curl -f -X GET http://mafia-linkedin:3000/cron/trigger -H "x-cron-secret: ${CRON_API_SECRET}"

      # Job 2: Linkedin Token Refresh
      ofelia.job-run.linkedin-token-refresh.schedule: "0 0 0 * * *"
      ofelia.job-run.linkedin-token-refresh.image: "curlimages/curl:latest"
      ofelia.job-run.linkedin-token-refresh.network: "mafia-network"
      ofelia.job-run.linkedin-token-refresh.command: >-
        curl -f -X GET http://mafia-linkedin:3000/cron/token-refresh -H "x-cron-secret: ${CRON_API_SECRET}"

      # Job 3: Main DB Cleanup
      ofelia.job-run.main-db-cleanup.schedule: "0 0 0 * * *"
      ofelia.job-run.main-db-cleanup.image: "curlimages/curl:latest"
      ofelia.job-run.main-db-cleanup.network: "mafia-network"
      ofelia.job-run.main-db-cleanup.command: >-
        curl -f -X GET http://mafia-main:3000/cron/db-cleanup -H "x-cron-secret: ${CRON_API_SECRET}"

networks:
  mafia-network:
    driver: bridge

  global-database-network:
    external: true

volumes:
  mafia-redis-data:

